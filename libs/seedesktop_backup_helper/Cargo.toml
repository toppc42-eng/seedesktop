[package]
name = "seedesktop_backup_helper"
version = "0.1.0"
edition = "2021"
description = "SeeDesktop GCS backup/restore (no Python, no PowerShell 7)"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
jsonwebtoken = "9"
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
chrono = "0.4"
regex = "1"
