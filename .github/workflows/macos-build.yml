name: SeeDesktop macOS Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: false
        default: "main"
      publish_gcs:
        description: "Upload DMG + version.json to GCS (needs SEEDESKTOP_GCS_CREDENTIALS_JSON secret)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'flutter/**'
      - 'libs/**'
      - 'build.py'
      - 'res/**'
      - 'Cargo.toml'
      - 'build.rs'
      - 'vcpkg.json'
      - '.github/workflows/macos-build.yml'
      - '.github/workflows/bridge.yml'

permissions:
  contents: read

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-macos:
    needs: [generate-bridge]
    # Intel x86_64 binary (runs on Intel Macs / VMs). macos-14/arm64 produces arm64-only apps.
    # GitHub retired macos-13; macos-15-intel is the supported Intel image (see github.blog changelog).
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      # Must match vcpkg.json "baseline" / bridge.yml / Cargo.toml rust-version.
      VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      # Pin Flutter: latest stable breaks this tree (extended_text / theme APIs / google_fonts).
      FLUTTER_VERSION: "3.24.5"
      # Must match bridge.yml and Cargo.toml rust-version (time-core 0.1.8 needs >= 1.88).
      RUST_VERSION: "1.88"

    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-apple-darwin
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: macos-build

      - name: Patch Flutter (dropdown filter)
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          if [[ "${{ env.FLUTTER_VERSION }}" == "3.24.5" ]]; then
            git apply "${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff" || true
          fi

      - name: Flutter dependencies
        run: |
          cd flutter
          sed -i '' -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml || sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml
          flutter pub get

      - name: Restore bridge artifacts
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: .

      - name: Verify bridge artifacts
        run: |
          set -euxo pipefail
          test -f src/bridge_generated.rs
          test -f flutter/lib/generated_bridge.dart
          test -f flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
          sed -i '' 's/ffi.NativeFunction<ffi.Bool Function(DartPort/ffi.NativeFunction<ffi.Uint8 Function(DartPort/g' \
            flutter/lib/generated_bridge.dart || \
          sed -i 's/ffi.NativeFunction<ffi.Bool Function(DartPort/ffi.NativeFunction<ffi.Uint8 Function(DartPort/g' \
            flutter/lib/generated_bridge.dart

      - name: Disable extra Rust lib targets (CI speed)
        run: sed -i '' 's/\["cdylib", "staticlib", "rlib"\]/["cdylib"]/g' Cargo.toml || sed -i 's/\["cdylib", "staticlib", "rlib"\]/["cdylib"]/g' Cargo.toml

      # Upstream RustDesk mac CI: Homebrew tools + NASM 2.x + vcpkg (libyuv/libvpx/aom/opus/ffmpeg… via manifest).
      - name: Install build prerequisites (Homebrew)
        run: |
          set -euxo pipefail
          brew update
          brew install llvm create-dmg cmake ninja
          if command -v pkg-config &>/dev/null; then
            echo "pkg-config already present"
          else
            brew install pkg-config
          fi
          brew install opus

      - name: Install NASM 2.16 (required by vcpkg aom/libvpx)
        run: |
          set -euxo pipefail
          curl -fLO https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -o nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (manifest)
        run: |
          set -euxo pipefail
          if ! "$VCPKG_ROOT/vcpkg" install --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
            done
            exit 1
          fi

      - name: Build macOS release (app + DMG via build.py)
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
        run: |
          set -euxo pipefail
          # Prefer Apple strip over Homebrew llvm; keep rustup/cargo on PATH.
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          command -v cargo
          python3 build.py --flutter --screencapturekit

      - name: Publish DMG to GCS
        if: inputs.publish_gcs == 'true'
        env:
          SEEDESKTOP_GCS_CREDENTIALS: credentials.json
        run: |
          set -euxo pipefail
          if [ -z "${{ secrets.SEEDESKTOP_GCS_CREDENTIALS_JSON }}" ]; then
            echo "SEEDESKTOP_GCS_CREDENTIALS_JSON secret is not configured."
            exit 1
          fi
          printf '%s' "${{ secrets.SEEDESKTOP_GCS_CREDENTIALS_JSON }}" > credentials.json
          python3 -m pip install -q google-cloud-storage
          python3 publish_update_mac.py

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-installer
          path: |
            SeeDesktop-*-macOS.dmg
            flutter/build/macos/Build/Products/Release/SeeDesktop.app
          if-no-files-found: error
