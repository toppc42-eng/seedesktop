# SeeDesktop Linux (.deb) — build on GitHub when no local Linux machine is available.
name: SeeDesktop Linux Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'flutter/**'
      - 'libs/**'
      - 'build.py'
      - 'res/**'
      - '.github/workflows/seedesktop-linux-build.yml'

env:
  FLUTTER_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  RUST_VERSION: "1.85"
  CARGO_EXPAND_VERSION: "1.0.95"
  # Must match vcpkg.json "builtin-baseline" (see flutter-build.yml / ci.yml).
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  DEB_ARCH: amd64

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-deb:
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            curl \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget \
            zip \
            unzip \
            libva-dev \
            libpam0g-dev \
            libasound2-dev \
            libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore bridge artifacts
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: .

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        run: |
          set -euxo pipefail
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-linux \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Patch Flutter deps and fetch packages
        run: |
          set -euxo pipefail
          cd flutter
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml
          flutter pub get

      - name: Build SeeDesktop .deb
        env:
          DEB_ARCH: ${{ env.DEB_ARCH }}
        run: |
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeeDesktop-linux-deb
          path: SeeDesktop-*.deb
          if-no-files-found: error
