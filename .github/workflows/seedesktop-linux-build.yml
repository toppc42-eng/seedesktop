# SeeDesktop Linux (.deb) — build on GitHub when no local Linux machine is available.
name: SeeDesktop Linux Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'flutter/**'
      - 'libs/**'
      - 'build.py'
      - 'res/**'
      - '.github/workflows/seedesktop-linux-build.yml'

env:
  FLUTTER_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  RUST_VERSION: "1.75"
  CARGO_EXPAND_VERSION: "1.0.95"
  VCPKG_COMMIT_ID: "2023.04.15"
  DEB_ARCH: amd64

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-deb:
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            curl \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget \
            zip \
            unzip \
            libva-dev \
            libpam0g-dev \
            libasound2-dev \
            libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup vcpkg
        run: |
          if [ ! -d "$HOME/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
            pushd "$HOME/vcpkg"
            git checkout ${{ env.VCPKG_COMMIT_ID }}
            ./bootstrap.sh
            popd
          fi
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Build SeeDesktop .deb
        env:
          DEB_ARCH: ${{ env.DEB_ARCH }}
        run: |
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeeDesktop-linux-deb
          path: SeeDesktop-*.deb
          if-no-files-found: error
