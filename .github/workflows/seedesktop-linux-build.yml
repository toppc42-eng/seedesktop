# SeeDesktop Linux (.deb) — build on GitHub when no local Linux machine is available.
name: SeeDesktop Linux Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'flutter/**'
      - 'libs/**'
      - 'build.py'
      - 'res/**'
      - 'Cargo.toml'
      - 'vcpkg.json'
      - 'scripts/build_linux.sh'
      - '.github/workflows/seedesktop-linux-build.yml'
      - '.github/workflows/bridge.yml'

env:
  FLUTTER_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  RUST_VERSION: "1.88"
  CARGO_EXPAND_VERSION: "1.0.95"
  # Must match vcpkg.json "builtin-baseline" (see flutter-build.yml / ci.yml).
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  DEB_ARCH: amd64

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-deb:
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet || true
          df -h

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            curl \
            git \
            g++ \
            dpkg \
            libayatana-appindicator3-dev \
            libclang-dev \
            libgtk-3-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            python3 \
            wget \
            zip \
            unzip \
            xz-utils \
            libva-dev \
            libpam0g-dev \
            libasound2-dev \
            libpulse-dev \
            libssl-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            librsvg2-bin \
            imagemagick

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: seedesktop-linux

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore bridge artifacts
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: .

      - name: Verify bridge artifacts
        run: |
          set -euxo pipefail
          test -f src/bridge_generated.rs
          test -f flutter/lib/generated_bridge.dart
          test -f flutter/macos/Runner/bridge_generated.h
          # FRB 1.80.1 + Dart 3.22 expect Uint8 for bool FFI (applied again in build.py).
          sed -i 's/ffi.NativeFunction<ffi.Bool Function(DartPort/ffi.NativeFunction<ffi.Uint8 Function(DartPort/g' \
            flutter/lib/generated_bridge.dart

      - name: Disable extra Rust lib targets (CI speed)
        run: |
          sed -i 's/\["cdylib", "staticlib", "rlib"\]/["cdylib"]/g' Cargo.toml

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        run: |
          set -euxo pipefail
          if ! "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-linux \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r log; do
              echo "=== $log ==="
              cat "$log" || true
              echo "================"
            done
            exit 1
          fi

      - name: Patch Flutter deps and fetch packages
        run: |
          set -euxo pipefail
          flutter config --enable-linux-desktop
          cd flutter
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml
          flutter pub get
          # Fail fast on Dart/Flutter API mismatches before the long Rust + vcpkg build.
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/desktop/pages/remote_page.dart \
            lib/common/widgets/crm_widgets.dart

      - name: Build SeeDesktop .deb
        env:
          DEB_ARCH: ${{ env.DEB_ARCH }}
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: |
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeeDesktop-linux-deb
          path: SeeDesktop-*.deb
          if-no-files-found: error
